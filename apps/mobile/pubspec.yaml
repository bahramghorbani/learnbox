name: learnbox
description: Persian-first German vocabulary learning app
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: IRANSansX LearnBox
      fonts:
        - asset: assets/fonts/IRANSansX-Regular.woff2
          weight: 400
        - asset: assets/fonts/IRANSansX-Bold.woff2
          weight: 700
  assets:
    - assets/bobo/
    - assets/launch/germany-welcome-v1.jpg
    - assets/content/
    - assets/cards/
    - assets/fonts/
