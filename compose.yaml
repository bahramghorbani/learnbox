services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: learnbox, POSTGRES_PASSWORD: learnbox, POSTGRES_DB: learnbox }
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: learnbox, MINIO_ROOT_PASSWORD: learnbox-local-only }
    ports: ['9000:9000', '9001:9001']
volumes: { postgres_data: {} }
