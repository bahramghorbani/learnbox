name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm verify:security
      - run: pnpm build
      - run: node scripts/validate-migrations.mjs
      - run: pnpm audit --prod --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - working-directory: apps/mobile
        run: flutter pub get && flutter analyze && flutter test && flutter build apk --debug
  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate isolated app Compose contract
        working-directory: infrastructure/production/app
        run: docker compose --env-file app.env.example --file compose.yaml config --quiet
      - name: Build learner app production image
        run: docker build --file infrastructure/production/app/Dockerfile --tag learnbox-learner-app:ci .
      - name: Validate Caddy routing configuration
        run: >-
          docker run --rm
          --volume "$PWD/infrastructure/production/landing/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
