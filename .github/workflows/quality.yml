name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read

# Supersede in-flight runs for the same PR/branch. A force-push or a quick
# follow-up commit no longer leaves an obsolete full run burning minutes.
# main is never cancelled: every merged commit keeps its own verification.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which areas a change can possibly affect. Cheap (seconds) and the
  # only job that always runs. Classification is an allow-list of provably
  # inert paths, so an unrecognised path always falls through to full CI
  # (scripts/ci-changed-areas.mjs, covered by scripts/ci-changed-areas.test.mjs).
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docsOnly }}
      mobile: ${{ steps.classify.outputs.mobile }}
      infra: ${{ steps.classify.outputs.infra }}
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A missing/zero base (first push of a branch, forced update) yields an
          # empty file list, which the classifier deliberately treats as full CI.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            FILES=""
          else
            FILES="$(git diff --name-only "${BASE}" "${HEAD}")"
          fi
          echo "--- changed files ---"
          echo "${FILES:-<none detected>}"
          echo "---------------------"
          printf '%s\n' "${FILES}" | node scripts/ci-changed-areas.mjs | tee -a "$GITHUB_OUTPUT"

  quality:
    needs: changes
    runs-on: ubuntu-latest
    # Disposable database for the server-authoritative progress acceptance test
    # (apps/website/test/learner-progress-source-of-truth.test.ts). It creates and
    # drops its own throwaway database, applies every repo migration, and hard-fails
    # in CI if this variable is missing, so the invariant can never be silently skipped.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      # Documentation-only changes cannot affect lint, types, tests, the build,
      # migrations or the dependency audit. The job still reports success so the
      # `quality` check resolves instead of hanging as Expected.
      - if: needs.changes.outputs.docs-only == 'true'
        run: echo 'Documentation-only change. No buildable source touched.'
      - if: needs.changes.outputs.docs-only != 'true'
        uses: actions/checkout@v5
      - if: needs.changes.outputs.docs-only != 'true'
        uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - if: needs.changes.outputs.docs-only != 'true'
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm check
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm verify:security
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm build
      - if: needs.changes.outputs.docs-only != 'true'
        run: node scripts/validate-migrations.mjs
      - if: needs.changes.outputs.docs-only != 'true'
        run: pnpm audit --prod --audit-level=high

  # Always runs in full, including on documentation. A secret can be committed
  # in a markdown file, so this protection is never skipped. It is also the
  # cheapest job in the workflow (~11s), so there is nothing to save here.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.mobile != 'true'
        run: echo 'No apps/mobile or workflow change. Flutter analyze/test/build not required.'
      - if: needs.changes.outputs.mobile == 'true'
        uses: actions/checkout@v5
      - if: needs.changes.outputs.mobile == 'true'
        uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.44.9 }
      - if: needs.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: flutter pub get && dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test && flutter build apk --debug

  production-stack:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      # The learner image is built from the repository root, so application
      # source, workspace packages and the lockfile all count as infra changes.
      - if: needs.changes.outputs.infra != 'true'
        run: echo 'No infrastructure, application, package or lockfile change. Production image unaffected.'
      - if: needs.changes.outputs.infra == 'true'
        uses: actions/checkout@v5
      - if: needs.changes.outputs.infra == 'true'
        name: Validate isolated app Compose contract
        working-directory: infrastructure/production/app
        run: docker compose --env-file app.env.example --file compose.yaml config --quiet
      - if: needs.changes.outputs.infra == 'true'
        name: Build learner app production image
        run: docker build --file infrastructure/production/app/Dockerfile --tag learnbox-learner-app:ci .
      - if: needs.changes.outputs.infra == 'true'
        name: Validate Caddy routing configuration
        run: >-
          docker run --rm
          --volume "$PWD/infrastructure/production/landing/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
