name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  quality:
    runs-on: ubuntu-latest
    # Disposable database for the server-authoritative progress acceptance test
    # (apps/website/test/learner-progress-source-of-truth.test.ts). It creates and
    # drops its own throwaway database, applies every repo migration, and hard-fails
    # in CI if this variable is missing, so the invariant can never be silently skipped.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm verify:security
      - run: pnpm build
      - run: node scripts/validate-migrations.mjs
      - run: pnpm audit --prod --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.44.9 }
      - working-directory: apps/mobile
        run: flutter pub get && dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test && flutter build apk --debug
  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate isolated app Compose contract
        working-directory: infrastructure/production/app
        run: docker compose --env-file app.env.example --file compose.yaml config --quiet
      - name: Build learner app production image
        run: docker build --file infrastructure/production/app/Dockerfile --tag learnbox-learner-app:ci .
      - name: Validate Caddy routing configuration
        run: >-
          docker run --rm
          --volume "$PWD/infrastructure/production/landing/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
