schema_version: 1
policy: >-
  Providers are interchangeable. Map required abstract capabilities to the available native tool,
  workflow, or careful manual process; do not make this repository depend on a provider-specific
  skill name.
capabilities:
  supervisor: Use the strongest configured reasoning tier; fail over only to the same capability tier.
  routine_worker: Bounded repetitive low-risk implementation and straightforward tests.
  substantial_worker: Significant implementation, debugging, refactoring and difficult coding.
  high_reasoning_worker: Architecture, security-sensitive work, important product or UI decisions and high-risk review.
  independent_critical_reviewer: Preferred critical execution or review route when separately verified as available.
providers:
  codex:
    repository_orientation: Git inspection and repository-document reading.
    implementation: Scoped repository editing on a dedicated branch.
    testing: Shell-based focused and feature-boundary commands.
    security_review: Repository security checks plus direct boundary review.
    github_pr: GitHub CLI or provider-approved GitHub integration.
    visual_qa: Browser or local rendered inspection.
    handoff: Update canonical continuity documents and PR evidence.
  claude_code:
    repository_orientation: Git inspection and repository-document reading.
    implementation: Scoped repository editing on a dedicated branch.
    testing: Shell-based focused and feature-boundary commands.
    security_review: Repository security checks plus direct boundary review.
    github_pr: GitHub CLI or provider-approved GitHub integration.
    visual_qa: Browser or local rendered inspection.
    handoff: Update canonical continuity documents and PR evidence.
  deepseek_flash:
    repository_orientation: Follow bootstrap, inspect live Git and read any applicable work record.
    implementation: Use a dedicated branch, preserve repository invariants and document scope.
    testing: Run available recorded checks and report unavailable mobile/device checks honestly.
    security_review: Preserve owner-gated security, identity, secret, migration, provider and production boundaries.
    github_pr: Create, review and merge a PR only after the documented local and GitHub checks are green.
    visual_qa: Record any unavailable emulator, Android Studio, Xcode, APK-install or physical-device evidence.
    handoff: Update canonical continuity documents and PR evidence.
  generic_capable_agent:
    repository_orientation: Read the bootstrap sequence and inspect Git before edits.
    implementation: Use a dedicated branch and preserve repository invariants.
    testing: Execute documented commands and retain exact results.
    security_review: Avoid secrets and preserve owner-gated service boundaries.
    github_pr: Use an authenticated repository workflow or leave the branch ready for review.
    visual_qa: Perform rendered RTL and responsive inspection when UI changes.
    handoff: Keep PROJECT_STATE.md and CURRENT_WORK.md accurate.
