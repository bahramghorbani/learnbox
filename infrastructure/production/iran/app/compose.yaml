name: learnbox-app-production

# Iran host. Mirrors the Germany compose; adds the internal DB network and the private DB CA
# (apps force sslmode=verify-full; NODE_EXTRA_CA_CERTS is the repo's established pattern).
services:
  app:
    image: learnbox-app@sha256:051f8697037fa4da68bb81499f4e0d4c220fff0a45cdf67e97487ab4a5adf190
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_EXTRA_CA_CERTS: /run/db-tls/ca.crt
    volumes:
      - /home/ubuntu/learnbox/db-tls/ca.crt:/run/db-tls/ca.crt:ro
    mem_limit: 1g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      edge:
        aliases: [learner-app]
      db: {}

networks:
  edge:
    name: learnbox-edge
    external: true
  db:
    name: learnbox-db
    external: true
