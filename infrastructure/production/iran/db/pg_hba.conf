# Unix socket inside the container only (entrypoint init, healthcheck, operator docker exec).
local   all   all                 trust
# Loopback inside the container (pg_isready health check). No credentials accepted without TLS elsewhere.
host    all   all   127.0.0.1/32  scram-sha-256
# Every network client must use TLS + SCRAM.
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
